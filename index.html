<!doctype html>
<html lang = "en-GB">
    <head>
        <meta charset= "UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Research calendar app</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="header">
            <div id="logo">
                <p>giso soup</p>

            </div>

        </div>

        <div id="graph-section">
            <div class="contribution-graph">
                <div class="input-and-generate">
                    <input type="text" id="username" placeholder="enter github username">
                        <button id="generate-graph">
                            <svg xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            height="24px"
                            width="24px"
                            fill="#2c2c2c">
                            <path d="M16.18,13H4V11H16.18l-5.6-5.6L12,4l8,8l-8,8l-1.42-1.4l5.6-5.6Z"/>
                            </svg>
                        </button>
                </div>
                <div class="actual-graph">

                </div>
            </div>
        </div>

        <script src="script.js" defer></script>
    </body>
