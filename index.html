<!doctype html>
<html lang = "en-GB">
    <head>
        <meta charset= "UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>giso soup!</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="header">
            <div id="logo">
                <svg class="soup" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="6vh" width="6vh" fill="var(--logo-colour)"><path d="M6,20q-0.82,0-1.41-0.59T4,18t0.59-1.41T6,16q0.13,0 0.25,0T6.5,16.05l3.55-3.55q-0.13-0.53 0.01-1.04t0.51-0.89t0.89-0.51q0.51-0.14 1.04-0.01L16.05,6.5Q16,6.38 16,6.25T16,6q0-0.82 0.59-1.41T18,4t1.41,0.59Q20,5.18 20,6T19.41,7.41T18,8q0,0-0.5-0.05l-3.55,3.53q0.13,0.53-0.01,1.05t-0.51,0.9q-0.4,0.4-0.91,0.54t-1.04-0.01L8.4,17h1.9q0.28-0.45 0.72-0.73T12,16q0.55,0 1.01,0.26T13.75,17h2.5q0.28-0.48 0.74-0.74T18,16q0.82,0 1.41,0.59Q20,17.18 20,18t-0.59,1.41T18,20q-0.55,0-1.01-0.27T16.25,19h-2.5q-0.27,0.48-0.74,0.74T12,20q-0.52,0-0.97-0.27T10.3,19H7.7q-0.27,0.45-0.72,0.73T6,20Zm0-6q-0.82,0-1.41-0.59T4,12t0.59-1.41T6,10q0.83,0 1.41,0.59Q8,11.18 8,12T7.41,13.41T6,14ZM6,8Q5.18,8 4.59,7.41T4,6T4.59,4.59T6,4Q6.83,4 7.41,4.59Q8,5.18 8,6T7.41,7.41T6,8Zm4.59-0.59Q10,6.82 10,6t0.59-1.41T12,4t1.41,0.59Q14,5.18 14,6T13.41,7.41T12,8T10.59,7.41ZM18,14q-0.82,0-1.41-0.59T16,12t0.59-1.41T18,10t1.41,0.59Q20,11.18 20,12t-0.59,1.41T18,14Z"/></svg>
                <p class="name">GisoSoup</p>
                <div class= "logo-text">your GitHub contributions in one place.</div>
            </div>


            <div id="add-and-settings-button-container">
                <button class="hover-button" id="light-dark">
                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun preview-icon hidden"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon preview-icon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
                </button>
                <button class="hover-button" id="settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sliders-horizontal preview-icon"><path d="M10 5H3"/><path d="M12 19H3"/><path d="M14 3v4"/><path d="M16 17v4"/><path d="M21 12h-9"/><path d="M21 19h-5"/><path d="M21 5h-7"/><path d="M8 10v4"/><path d="M8 12H3"/></svg>
                </button>
            </div>

        </div>

        <div id="graph-section">
            
            <div class="contribution-graph">
                <div class="input-and-generate">
                    <input type="text" id="username" placeholder="enter github username">
                        <button class="hover-button" id="generate-graph">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="lucide lucide-arrow-right preview-icon">
                                <path d="M5 12h14"/>
                                <path d="m12 5 7 7-7 7"/>
                            </svg>
                        </button>
                </div>

         
                
                <div id="contribution-container">
                    <div id="total-contributions">
                        
                        contribution(s)</div>
                    <div id="week-month-grid">
                        <div class="hidden" id="weekday-labels">
                            <span class="weekday">Mon</span>
                            <span class="weekday">Tue</span>
                            <span class="weekday">Wed</span>
                            <span class="weekday">Thu</span>
                            <span class="weekday">Fri</span>
                            <span class="weekday">Sat</span>
                            <span class="weekday">Sun</span>
                        </div>

                        <div class="hidden" id="loading">Fetching contributions...</div>

                        <div id="month-labels-and-contrib-grid">
                            <div id="month-labels">

                            </div>

                            <div class="hidden" id="contribution-grid">


                            </div>
                        </div>
                    </div>
                    <div id="less-to-more">
                        <p class="range">less</p>
                        <div class="lev-0"></div>
                        <div class="lev-1"></div>
                        <div class="lev-2"></div>
                        <div class="lev-3"></div>
                        <div class="lev-4"></div>
                        <p class="range">more</p>
                    </div>
                </div>
                
         


            </div>
        </div>
        <div id="contribution-tooltip" class="hidden"></div>
        

        <script src="script.js" defer></script>
    </body>
